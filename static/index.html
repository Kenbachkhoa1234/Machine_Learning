<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Security Checker</title>
  <style>
    :root {
      --bg: #070c18;
      --card: #0f1729;
      --card-2: #131e35;
      --border: #1e2e4d;
      --text: #eaf1ff;
      --muted: #8ea3c7;
      --accent: #0ea5e9;
      --safe: #10b981;
      --safe-bg: rgba(16, 185, 129, 0.11);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 16px 64px;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(14, 165, 233, 0.09), transparent 35%),
        radial-gradient(circle at 80% 85%, rgba(16, 185, 129, 0.05), transparent 35%),
        var(--bg);
    }

    .wrapper {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .shield {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0284c7, #10b981);
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: 0 8px 28px rgba(14, 165, 233, 0.25);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      letter-spacing: -0.01em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .url-box {
      flex: 1 1 360px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #060a14;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .url-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.16);
    }

    .btn-check {
      padding: 14px 24px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-check:hover { opacity: 0.92; }
    .btn-check:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-ghost {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 13px;
      border: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    .result.LEGITIMATE {
      background: var(--safe-bg);
      border-color: rgba(16, 185, 129, 0.45);
    }

    .result.PHISHING {
      background: var(--danger-bg);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .result.ERROR {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .LEGITIMATE .badge {
      background: rgba(16, 185, 129, 0.22);
      color: #6ee7b7;
    }

    .PHISHING .badge {
      background: rgba(239, 68, 68, 0.26);
      color: #fca5a5;
    }

    .storage-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: rgba(15, 23, 41, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
    }

    .result h2 {
      margin: 0 0 6px;
      font-size: 1.18rem;
    }

    .result .advice {
      margin: 0;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    /* Highlighted Domain Display */
    .domain-spotlight {
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 9px;
      background: rgba(6, 10, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-family: var(--mono);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .flagged-char {
      display: inline-block;
      padding: 0 4px;
      margin: 0 1px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.32);
      border: 1px solid #ef4444;
      color: #fecaca;
      font-weight: 800;
    }

    /* Reasons Box */
    .reasons-box {
      margin-top: 14px;
      padding: 12px 15px;
      border-radius: 10px;
      background: rgba(6, 10, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reasons-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .reasons-list {
      margin: 0;
      padding-left: 18px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .reasons-list li { margin-bottom: 4px; }

    /* Fingerprint Footer */
    .fingerprint-grid {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      font-size: 0.78rem;
    }

    .fp-item span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-bottom: 2px;
    }

    .fp-item code {
      font-family: var(--mono);
      color: var(--text);
      word-break: break-all;
    }

    /* Saved History Panel */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h3 {
      margin: 0;
      font-size: 0.98rem;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 13px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .history-row:hover { border-color: var(--accent); }

    .history-left {
      min-width: 0;
      flex: 1;
    }

    .history-target {
      font-family: var(--mono);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-hash {
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .mini-tag {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .mini-tag.LEGITIMATE {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
    }

    .mini-tag.PHISHING {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .hidden { display: none !important; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="header">
      <div class="shield">🛡️</div>
      <h1>URL Security Checker</h1>
      <p>Kiểm tra mức độ an toàn đường dẫn hoặc tra cứu báo cáo đã lưu bằng mã băm SHA-256</p>
    </div>

    <section class="card">
      <form class="input-row" onsubmit="onSubmitUrl(event)">
        <input
          id="urlField"
          class="url-box"
          type="text"
          maxlength="4096"
          aria-label="Nhập địa chỉ URL hoặc mã băm SHA-256"
          placeholder="Dán URL (https://...) hoặc mã SHA-256..."
          autocomplete="off"
          spellcheck="false"
          required
        />
        <button id="submitBtn" class="btn-check" type="submit">Kiểm tra</button>
      </form>

      <div id="resultBox" class="result hidden"></div>
    </section>

    <section class="card" id="historySection">
      <div class="history-header">
        <h3>🗂️ Lịch sử phân tích đã lưu (SHA-256)</h3>
        <button type="button" class="btn-ghost" onclick="loadHistory()">Làm mới</button>
      </div>
      <div id="historyList" class="history-list">
        <div style="color: var(--muted); font-size: 0.85rem;">Chưa có bản ghi nào được lưu.</div>
      </div>
    </section>
  </main>

  <script>
    let currentOriginalQuery = "";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderHighlightedHost(highlights, fallbackHost) {
      if (!Array.isArray(highlights) || !highlights.length) {
        return escapeHtml(fallbackHost || "");
      }
      return highlights
        .map(item =>
          item.flagged
            ? `<span class="flagged-char" title="Ký tự giả mạo hoặc khác bảng mã chuẩn">${escapeHtml(item.char)}</span>`
            : escapeHtml(item.char)
        )
        .join("");
    }

    async function onSubmitUrl(event) {
      event.preventDefault();
      const query = document.getElementById("urlField").value.trim();
      if (!query) return;
      await runCheck(query, false);
    }

    async function runCheck(query, reanalyze) {
      const btn = document.getElementById("submitBtn");
      const box = document.getElementById("resultBox");
      currentOriginalQuery = query;

      btn.disabled = true;
      btn.textContent = "Đang xử lý...";

      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: query, reanalyze }),
        });
        const data = await res.json();

        if (!res.ok) {
          box.className = "result ERROR";
          box.innerHTML = `<p class="advice">${escapeHtml(data.error || "Không thể xử lý yêu cầu.")}</p>`;
          box.classList.remove("hidden");
          return;
        }

        renderResultCard(data, query);
        await loadHistory();
      } catch (_err) {
        box.className = "result ERROR";
        box.innerHTML = "<p class='advice'>Không thể kết nối tới máy chủ kiểm tra.</p>";
        box.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Kiểm tra";
      }
    }

    function renderResultCard(d, rawQuery) {
      const box = document.getElementById("resultBox");
      const verdict = d.verdict === "LEGITIMATE" ? "LEGITIMATE" : "PHISHING";
      const storageLabel = d.from_cache
        ? `💾 Đã lưu sẵn (Tra cứu lần ${d.hit_count})`
        : `✨ Đã phân tích & lưu mới`;

      const isHashLookup = /^[a-fA-F0-9]{64}$/.test(rawQuery);
      const reanalyzeBtn = !isHashLookup
        ? `<button type="button" class="btn-ghost" onclick="reanalyzeCurrent()">🔄 Phân tích lại</button>`
        : "";

      const reasonsHtml = (d.reasons || [])
        .map(r => `<li>${escapeHtml(r)}</li>`)
        .join("");

      const hasSpoofedHost =
        d.unicode_host &&
        d.punycode_host &&
        d.unicode_host !== d.punycode_host;

      const punyLabel = d.punycode_host && d.punycode_host.includes("xn--") ? "Punycode" : "ASCII gốc";
      const punycodeNote = hasSpoofedHost
        ? `<span style="color:var(--muted); font-size:0.8rem;">${punyLabel}: <code>${escapeHtml(d.punycode_host)}</code></span>`
        : "";

      box.className = `result ${verdict}`;
      box.innerHTML = `
        <div class="result-top">
          <div class="badge-group">
            <span class="badge">${verdict}</span>
            <span class="storage-pill">${escapeHtml(storageLabel)}</span>
          </div>
          ${reanalyzeBtn}
        </div>

        <h2>${escapeHtml(d.title)}</h2>
        <p class="advice">${escapeHtml(d.advice)}</p>

        <div class="domain-spotlight">
          <div>
            <span style="color:var(--muted); font-size:0.76rem; margin-right:6px;">Mục tiêu:</span>
            <span>${d.unicode_host ? renderHighlightedHost(d.char_highlights, d.unicode_host) : escapeHtml(d.target_display)}</span>
          </div>
          ${punycodeNote}
        </div>

        <div class="reasons-box">
          <div class="reasons-title">Nhận định phân tích</div>
          <ul class="reasons-list">${reasonsHtml}</ul>
        </div>

        <div class="fingerprint-grid">
          <div class="fp-item" style="grid-column: 1 / -1;">
            <span>Mã định danh bản ghi (SHA-256) <button type="button" class="btn-ghost" style="padding:2px 8px; margin-left:6px; font-size:0.7rem;" onclick="copyHash('${escapeHtml(d.sha256)}', this)">Copy</button></span>
            <code>${escapeHtml(d.sha256)}</code>
          </div>
          <div class="fp-item">
            <span>Ghi nhận lần đầu (UTC)</span>
            <code>${escapeHtml(d.first_seen)}</code>
          </div>
          <div class="fp-item">
            <span>Cập nhật gần nhất (UTC)</span>
            <code>${escapeHtml(d.last_seen)}</code>
          </div>
        </div>
      `;
      box.classList.remove("hidden");
    }

    function reanalyzeCurrent() {
      if (currentOriginalQuery) {
        runCheck(currentOriginalQuery, true);
      }
    }

    async function copyHash(hash, btnEl) {
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(hash);
          copied = true;
        }
      } catch (_e) {}

      if (!copied) {
        const ta = document.createElement("textarea");
        ta.value = hash;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { copied = document.execCommand("copy"); } catch (_e) {}
        document.body.removeChild(ta);
      }

      if (btnEl && copied) {
        const orig = btnEl.textContent;
        btnEl.textContent = "Đã chép ✓";
        setTimeout(() => { btnEl.textContent = orig; }, 1500);
      }
    }

    function lookupSavedHash(hash) {
      const input = document.getElementById("urlField");
      input.value = hash;
      runCheck(hash, false);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/history");
        if (!res.ok) return;
        const data = await res.json();
        const items = data.items || [];
        const container = document.getElementById("historyList");
        if (!items.length) {
          container.innerHTML = "<div style='color: var(--muted); font-size: 0.85rem;'>Chưa có bản ghi nào được lưu.</div>";
          return;
        }
        container.innerHTML = items
          .map(item => {
            const showPuny =
              item.punycode_host &&
              item.unicode_host &&
              item.punycode_host !== item.unicode_host.toLowerCase();
            const punySuffix = showPuny
              ? ` <span style="color:var(--muted); font-size:0.76rem;">(${escapeHtml(item.punycode_host)})</span>`
              : "";
            return `
            <div class="history-row" onclick="lookupSavedHash('${escapeHtml(item.url_hash)}')" title="Bấm để mở lại báo cáo từ SHA-256">
              <div class="history-left">
                <div class="history-target">${escapeHtml(item.target_display)}${punySuffix}</div>
                <div class="history-hash">SHA-256: ${escapeHtml(item.url_hash.slice(0, 24))}... · Lượt tra cứu: ${escapeHtml(item.hit_count)}</div>
              </div>
              <span class="mini-tag ${escapeHtml(item.verdict)}">${escapeHtml(item.verdict)}</span>
            </div>
          `;
          })
          .join("");
      } catch (_e) {}
    }

    loadHistory();
  </script>
</body>
</html>
